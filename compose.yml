name: syncup

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    volumes:
      # Mount the parent directory so the named volume owns the full
      # PostgreSQL home, including PGDATA.
      - syncup_pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-syncup}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app

  backend:
    image: ${SYNCUP_BACKEND_IMAGE:-ghcr.io/halva2251/syncup-backend:latest}
    restart: unless-stopped
    env_file:
      # Deployment tools such as Komodo write the stack environment file here.
      # Keep all runtime settings in this one file; backend/.env is local-dev only.
      - ./.env
    environment:
      DEBUG: "false"
      FRONTEND_URL: ${PUBLIC_ORIGIN:-https://syncup.ruu.by}
      CORS_ALLOWED_ORIGINS: '["${PUBLIC_ORIGIN:-https://syncup.ruu.by}"]'
      # Docker assigns the app network a free subnet. Trust proxy headers only
      # from Docker's standard private bridge range, where the frontend lives.
      TRUSTED_PROXY_HOSTS: 172.16.0.0/12
      # This must use the Compose service name, never localhost. Inside a
      # container, localhost refers to that same container.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-syncup}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-syncup}
      SPOTIFY_REDIRECT_URI: ${PUBLIC_ORIGIN:-https://syncup.ruu.by}/api/auth/spotify/callback
      STEAM_OPENID_RETURN_TO: ${PUBLIC_ORIGIN:-https://syncup.ruu.by}/api/connect/steam/openid/callback
      STEAM_OPENID_REALM: ${PUBLIC_ORIGIN:-https://syncup.ruu.by}
      LASTFM_REDIRECT_URI: ${PUBLIC_ORIGIN:-https://syncup.ruu.by}/api/connect/lastfm/oauth/callback
      ANILIST_REDIRECT_URI: ${PUBLIC_ORIGIN:-https://syncup.ruu.by}/api/connect/anilist/oauth/callback
      TRAKT_REDIRECT_URI: ${PUBLIC_ORIGIN:-https://syncup.ruu.by}/api/connect/trakt/oauth/callback
      REDDIT_REDIRECT_URI: ${PUBLIC_ORIGIN:-https://syncup.ruu.by}/api/connect/reddit/oauth/callback
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - syncup_uploads:/app/data/uploads
    expose:
      - "3020"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3020/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${SYNCUP_FRONTEND_IMAGE:-ghcr.io/halva2251/syncup-frontend:latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3020
    ports:
      - "127.0.0.1:${SYNCUP_PORT:-8090}:8090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

networks:
  app: {}

volumes:
  syncup_pgdata:
  syncup_uploads:
