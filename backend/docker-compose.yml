# LOCAL DEVELOPMENT ONLY — not suitable for production as-is.
# Before deploying: pin the image digest, replace the hardcoded password,
# create a least-privilege DB user, and inject secrets via env/secrets manager.
# See docs/dev-guide.md "Before you go to production" for the full checklist.
name: syncup

services:
  db:
    image: pgvector/pgvector:pg18
    volumes:
      # Mounted at /var/lib/postgresql (parent of PGDATA=/var/lib/postgresql/data)
      # so the named volume owns the full postgres home directory.
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: syncup
      POSTGRES_PASSWORD: syncup
      POSTGRES_DB: syncup
    ports:
      - '127.0.0.1:5432:5432'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U syncup -d syncup" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
